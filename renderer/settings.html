<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>memoSync 설정</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <h1>설정</h1>

    <section>
      <h2>동기화 폴더</h2>
      <p class="hint">OneDrive, Dropbox, Google Drive 안의 폴더를 PC마다 같은 폴더로 지정하면 메모가 동기화됩니다.</p>
      <p class="path" id="folder"></p>
      <p class="hint" id="folder-note"></p>
      <div class="actions">
        <button id="choose" type="button" class="primary">폴더 변경</button>
        <button id="open" type="button">폴더 열기</button>
        <button id="reset" type="button">기본 폴더로</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </section>

    <section>
      <h2>옵션</h2>
      <label class="check">
        <input id="sync-position" type="checkbox">
        <span>
          창 위치와 크기, 항상 위도 동기화
          <small>PC마다 해상도가 다르면 위치가 어긋날 수 있습니다. 끄면 이 PC에만 저장합니다.</small>
        </span>
      </label>
      <label class="check">
        <input id="auto-start" type="checkbox">
        <span>로그인 시 자동 시작</span>
      </label>
    </section>

    <section>
      <h2>이 기기</h2>
      <p class="path" id="device"></p>
    </section>
  </main>
  <script src="settings.js"></script>
</body>
</html>
